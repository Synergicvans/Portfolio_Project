name: Sync projects and deploy portfolio
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync public repositories
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.mjs
      - name: Test and build
        run: |
          node --test tests/*.test.mjs
          node build.mjs
      - name: Save generated catalogue
        if: github.event_name != 'push'
        run: |
          git config user.name 'Portfolio sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.json data/project-metadata.json data/knowledge.json images/projects index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public project catalogue'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
